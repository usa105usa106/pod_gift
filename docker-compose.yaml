services:
  gift-hunter:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      SETUP_PIN: ${SETUP_PIN:-}
      DATA_DIR: /app/data
      ADAPTIVE_SCAN: ${ADAPTIVE_SCAN:-true}
      SCAN_START_INTERVAL_MS: ${SCAN_START_INTERVAL_MS:-120}
      SCAN_MIN_INTERVAL_MS: ${SCAN_MIN_INTERVAL_MS:-0}
      SCAN_MAX_INTERVAL_MS: ${SCAN_MAX_INTERVAL_MS:-2000}
      SCAN_ACCELERATE_EVERY: ${SCAN_ACCELERATE_EVERY:-4}
      SCAN_ACCELERATE_FACTOR: ${SCAN_ACCELERATE_FACTOR:-0.75}
      SCAN_BACKOFF_FACTOR: ${SCAN_BACKOFF_FACTOR:-2.0}
      SCAN_BACKOFF_FLOOR_MS: ${SCAN_BACKOFF_FLOOR_MS:-100}
      FLOOD_WAIT_EXTRA_MS: ${FLOOD_WAIT_EXTRA_MS:-150}
      NEAR_TARGET_DISTANCE: ${NEAR_TARGET_DISTANCE:-25}
      PREPARE_AHEAD: ${PREPARE_AHEAD:-100}
      PREPARE_REFRESH_SECONDS: ${PREPARE_REFRESH_SECONDS:-420}
      MAX_UPGRADE_STARS: ${MAX_UPGRADE_STARS:-2000}
      KEEP_ORIGINAL_DETAILS: ${KEEP_ORIGINAL_DETAILS:-true}
      STOP_AFTER_SUCCESS: ${STOP_AFTER_SUCCESS:-false}
      DIAGNOSTICS_INTERVAL_SECONDS: ${DIAGNOSTICS_INTERVAL_SECONDS:-1.0}
      LIVE_STATUS_INTERVAL_SECONDS: ${LIVE_STATUS_INTERVAL_SECONDS:-1.0}
      STRESS_STATUS_INTERVAL_SECONDS: ${STRESS_STATUS_INTERVAL_SECONDS:-2.0}
      STATUS_REPLACE_AFTER_FAILURES: ${STATUS_REPLACE_AFTER_FAILURES:-2}
      STATUS_REPLACE_COOLDOWN_SECONDS: ${STATUS_REPLACE_COOLDOWN_SECONDS:-5.0}
      HEALTHCHECK_MAX_AGE_SECONDS: ${HEALTHCHECK_MAX_AGE_SECONDS:-45}
      TASK_STOP_TIMEOUT_SECONDS: ${TASK_STOP_TIMEOUT_SECONDS:-4.0}
      CATALOG_CONCURRENCY: ${CATALOG_CONCURRENCY:-6}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - gift_hunter_data:/app/data

volumes:
  gift_hunter_data:
    name: pod_gift_data
